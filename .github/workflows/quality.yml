name: Quality checks
on:
  push:
  pull_request:
jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/obsidian-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/obsidian-plugin/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check required plugin assets
        run: node -e "const fs=require('fs'); const m=require('./manifest.json'); if(m.id!=='pt-english-tutor'||!fs.statSync('main.js').size||!fs.statSync('styles.css').size) process.exit(1)"
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/writing-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
